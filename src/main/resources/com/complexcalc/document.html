<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <script>
        window.MathJax = {
            loader: {
                load: ['output/svg']
            },
            svg: {
                scale: 2
            },
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                macros: {
                    conj: "\\operatorname{conj}"
                }
            },
            startup: {
                ready() {
                    MathJax.startup.defaultReady();
                    window.javabridge.onMathJaxReady();
                }
            }
        };
    </script>

    <script>
        (function () {
            const origFetch = window.fetch;
            window.fetch = function (...args) {
                console.log("FETCH:", args[0]);
                return origFetch.apply(this, args);
            };
        })();
    </script>

    <script src="./mathjax/tex-chtml.js"></script>

    <style>
        body {
            background: rgb(10, 9, 27);
            color: rgb(233, 233, 233);
        }
    </style>
</head>

<body>
    \[
    \textbf{Complex Calculator v.0.7.0} \\\\[6pt]
    \] \[
    \text{©Filip M. & Andre M., 2026} \\\\[4pt]
    \]
    <div id="output"></div>
</body>

</html>

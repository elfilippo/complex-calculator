<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="mathlive-static.css">
</head>

<body style="margin:0; padding:10px; background:white;">

    <math-field id="mf" style="font-size:28px; width:100%;"></math-field>

    <!-- Load AFTER the element is in the DOM, and use defer -->
    <script src="mathlive.min.js" defer></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            customElements.whenDefined("math-field").then(() => {
                const mf = document.getElementById("mf");

                // A cleaner reflow function that won't cause infinite loops
                function forceLayoutRefresh() {
                    window.dispatchEvent(new Event("resize"));

                    // Force WebKit to recalculate the layout
                    document.body.style.display = "none";
                    document.body.offsetHeight; // Read a property to force repaint
                    document.body.style.display = "";
                }

                // ===== Java bridge =====
                window.getExpr = () => mf.getValue("latex");
                window.setExpr = (v) => { mf.value = v; };

                // ===== Mathfield configuration =====
                mf.setOptions({
                    virtualKeyboardMode: "manual",   // "manual" | "onfocus" | "off"
                    smartFence: true,
                    smartSuperscript: true,
                    scrollOnInsert: true,
                });

                // ===== Virtual keyboard customization and Fixes =====
                if (window.mathVirtualKeyboard) {

                    mathVirtualKeyboard.visible = true;

                    mathVirtualKeyboard.layouts = [
                        {
                            label: "Numbers",
                            rows: [
                                ["1", "2", "3", "+", "-"],
                                ["4", "5", "6", { latex: "\\times", label: "×" }, { latex: "\\div", label: "÷" }],
                                ["7", "8", "9", "(", ")"],
                                ["0", ".", ",", "=", "^{#?}"]
                            ]
                        },
                        {
                            label: "Variables",
                            rows: [
                                ["x", "y", "z", "t"],
                                ["a", "b", "c", "n"],
                                ["i", "e", { latex: "\\pi", label: "π" }, { latex: "\\infty", label: "∞" }],
                                ["_{#?}", { latex: "<", label: "<" }, { latex: ">", label: ">" }, { latex: "\\neq", label: "≠" }]
                            ]
                        },
                        {
                            label: "Functions",
                            rows: [
                                ["\\sqrt{#?}", "\\sqrt[#?]{#?}", "\\frac{#?}{#?}", { latex: "\\text{abs}({#?})", label: "abs" }],
                                ["\\ln", "\\log_{#?}({#?})", "\\exp", { latex: "\\text{conj}({#?})", label: "conj" }],
                                [{ latex: "\\text{floor}({#?})", label: "floor" }, { latex: "\\text{ceil}({#?})", label: "ceil" }, { latex: "\\text{round}({#?})", label: "round" }, { latex: "\\text{hypot}({#?}, {#?})", label: "hypot" }]
                            ]
                        },
                        {
                            label: "Trig",
                            rows: [
                                ["\\sin", "\\cos", "\\tan", "\\cot"],
                                [{ latex: "\\text{sec}", label: "sec" }, { latex: "\\text{csc}", label: "csc" }, "\\arcsin", "\\arccos"],
                                ["\\arctan", { latex: "\\text{arccot}", label: "arccot" }, { latex: "\\text{arcsec}", label: "arcsec" }, { latex: "\\text{arccsc}", label: "arccsc" }],
                                [{ latex: "\\text{atan2}({#?}, {#?})", label: "atan2" }, "", "", ""]
                            ]
                        },
                        {
                            label: "Advanced",
                            rows: [
                                ["\\sinh", "\\cosh", "\\tanh", "\\coth"],
                                // FIX: Explicit labels stop the rendering layout engine from generating slashes
                                [{ latex: "\\text{sech}", label: "sech" }, { latex: "\\text{csch}", label: "csch" }, { latex: "\\text{arsinh}", label: "arsinh" }, { latex: "\\text{arcosh}", label: "arcosh" }],
                                [{ latex: "\\text{artanh}", label: "artanh" }, { latex: "\\text{arcoth}", label: "arcoth" }, { latex: "\\text{arsech}", label: "arsech" }, { latex: "\\text{arcsch}", label: "arcsch" }],
                                ["\\sum_{#?}^{#?}", "\\prod_{#?}^{#?}", "\\int_{#?}^{#?}", "\\lim_{{#?} \\to {#?}}"]
                            ]
                        }
                    ];

                    mathVirtualKeyboard.plonkSound = false;

                    // FIX PART 1: Listen for MathLive's built-in geometry change event
                    window.mathVirtualKeyboard.addEventListener("geometrychange", () => {
                        if (window.mathVirtualKeyboard.visible) {
                            // Use a slight delay to ensure MathLive has updated the DOM
                            setTimeout(forceLayoutRefresh, 50);
                        }
                    });

                    // FIX PART 2: Intercept the show() method in case it is called programmatically from Java
                    const originalShow = window.mathVirtualKeyboard.show.bind(window.mathVirtualKeyboard);
                    window.mathVirtualKeyboard.show = () => {
                        originalShow();
                        setTimeout(forceLayoutRefresh, 50);
                    };
                }

                // Trigger the initial load fixes
                setTimeout(forceLayoutRefresh, 50);
                setTimeout(forceLayoutRefresh, 250);

                // ===== notify Java =====
                if (window.javaConnector) {
                    window.javaConnector.onReady();
                }
            });
        });
    </script>

</body>

</html>
